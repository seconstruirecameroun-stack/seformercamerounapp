# Le site vit sur https://seformercameroun.netlify.app
# Projet Netlify : seformercameroun, equipe seconstruirecameroun.
# Il se redeploie tout seul a chaque poussee sur main.
#
# Trois variables se renseignent dans Netlify : Site configuration >
# Environment variables.
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   VITE_VAPID_PUBLIC_KEY   (la moitie publique des rappels du soir)
# La cle service_role n'a rien a faire ici, ni la moitie privee VAPID.

[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Application monopage : toute URL inconnue doit rendre index.html, sinon un
# rafraichissement sur /parent renvoie une 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
